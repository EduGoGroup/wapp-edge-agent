name: CI

# CI de wapp-edge-agent (módulo Go único, público).
# Régimen local (2026-08-01): la validación continua vive en la Mac de
# desarrollo (`make ci-local` / `make ci-docker`, Go 1.26.5 + golangci-lint
# v2.12.2 fijados), no en Actions. Este workflow queda para corridas
# manuales (release futuro) — no se dispara con push ni pull_request.
# Como los módulos wApp son PÚBLICOS, NO se necesita GOPRIVATE ni token: el
# proxy público resuelve las dependencias (wapp-shared/*, wapp-cloudlink).
# (El cross-build de los 5 targets del Edge es un concern de release, no de CI; se añadirá aparte.)
on:
  workflow_dispatch:

env:
  GO_VERSION: '1.26.5'

jobs:
  test:
    name: Tests + estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt (sin archivos sin formatear)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Archivos sin gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Descargar dependencias
        run: go mod download

      - name: go.mod / go.sum tidy (sin diff)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: Tests (race)
        run: go test -race ./...

      - name: Build
        run: go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m
