<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wApp Edge · Iniciar sesión</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wapp-auth-container">
      <!-- Aviso de daemon caído / bootstrap -->
      <section id="section-daemon-down" class="wapp-card wapp-login-card hidden">
        <div class="wapp-login-header">
            <div class="wapp-brand-badge">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                    <path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2Zm0 2a8 8 0 1 1-4.2 14.8l-.3-.2-2.7.8.8-2.6-.2-.3A8 8 0 0 1 12 4Z"/>
                </svg>
            </div>
            <h1 class="wapp-title">wApp Edge</h1>
            <p class="wapp-subtitle">Núcleo Detenido</p>
        </div>
        <p class="detail" style="text-align: center;">El núcleo del Edge no está corriendo. Arráncalo para continuar.</p>
        <div class="wapp-actions">
          <button id="btn-start-daemon" type="button" class="wapp-btn wapp-btn--filled">Arrancar daemon</button>
        </div>
        <p id="daemon-down-status" class="detail muted" style="text-align: center; margin-top: 8px;"></p>
      </section>

      <!-- Enrolar (primera ejecución, antes del login) -->
      <section id="section-enroll" class="wapp-card wapp-login-card hidden">
        <div class="wapp-login-header">
            <div class="wapp-brand-badge">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                    <path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2Zm0 2a8 8 0 1 1-4.2 14.8l-.3-.2-2.7.8.8-2.6-.2-.3A8 8 0 0 1 12 4Z"/>
                </svg>
            </div>
            <h1 class="wapp-title">Enrolar Equipo</h1>
            <p class="wapp-subtitle">Introduce tu activation code de wApp Cloud</p>
        </div>
        <form id="enroll-form" class="wapp-form-stack" autocomplete="off">
          <div class="wapp-field">
            <label class="wapp-field__label" for="enroll-code">Código de activación</label>
            <input id="enroll-code" class="wapp-field__control" type="text" spellcheck="false" placeholder="Activation code" required />
          </div>
          <div class="wapp-actions">
            <button id="enroll-submit" type="submit" class="wapp-btn wapp-btn--filled">Enrolar</button>
          </div>
        </form>
        <p id="enroll-status" class="detail muted" style="text-align: center; margin-top: 8px;"></p>
      </section>

      <!-- Login del operador -->
      <section id="section-login" class="wapp-card wapp-login-card hidden">
        <!-- Encabezado de la Tarjeta -->
        <div class="wapp-login-header">
            <div class="wapp-brand-badge">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                    <path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2Zm0 2a8 8 0 1 1-4.2 14.8l-.3-.2-2.7.8.8-2.6-.2-.3A8 8 0 0 1 12 4Z"/>
                </svg>
            </div>
            <h1 class="wapp-title">wApp</h1>
            <p class="wapp-subtitle">Plano de Control Local</p>
        </div>

        <!-- Componente Alpha: Selector de Usuarios de Prueba -->
        {{ if .EnableAlphaTestAccounts }}
        <div class="wapp-field wapp-field--alpha" id="alpha-user-container">
            <label class="wapp-field__label" for="alpha-user-select">
                <span>Usuario de prueba (Alpha)</span>
            </label>
            <select class="wapp-field__control" id="alpha-user-select" aria-label="Selecciona un usuario de prueba">
                <option value="" selected disabled>Selecciona para autocompletar el email...</option>
                <option value="admin@e2e.local" data-email="admin@e2e.local" data-password="1234567890AB">Administrador e2e (admin@e2e.local)</option>
                <option value="admin-b@e2e.local" data-email="admin-b@e2e.local" data-password="1234567890AB">Admin Tenant B (admin-b@e2e.local)</option>
            </select>
        </div>
        {{ end }}

        <!-- Mensaje de Error / Alerta -->
        <div id="login-error" class="wapp-snackbar wapp-snackbar--error hidden" role="alert"></div>

        <!-- Formulario de Login -->
        <form id="login-form" class="wapp-form-stack" autocomplete="on">
          <div class="wapp-field">
            <label class="wapp-field__label" for="login-email">Correo electrónico</label>
            <input id="login-email" class="wapp-field__control" type="email" autocomplete="username" placeholder="tu@empresa.com" required autofocus />
          </div>

          <div class="wapp-field">
            <label class="wapp-field__label" for="login-password">Contraseña</label>
            <input id="login-password" class="wapp-field__control" type="password" autocomplete="current-password" placeholder="••••••••" required />
          </div>

          <div class="wapp-actions">
            <button id="login-submit" type="submit" class="wapp-btn wapp-btn--filled">Iniciar sesión</button>
          </div>
        </form>
      </section>
    </div>

    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const show = (elm, on) => elm.classList.toggle("hidden", !on);

      const secDown = $("section-daemon-down");
      const secEnroll = $("section-enroll");
      const secLogin = $("section-login");

      async function refreshState() {
        show(secDown, false);
        show(secEnroll, false);
        show(secLogin, false);
        try {
          const res = await fetch("/v1/enroll/status", { headers: { Accept: "application/json" } });
          if (res.status === 503) {
            show(secDown, true);
            return;
          }
          const body = await res.json();
          if (body && body.enrolled === false) {
            show(secEnroll, true);
            return;
          }
          show(secLogin, true);
        } catch (_) {
          show(secDown, true);
        }
      }

      $("btn-start-daemon").addEventListener("click", async () => {
        const st = $("daemon-down-status");
        st.textContent = "Arrancando el núcleo…";
        try {
          const res = await fetch("/v1/daemon/start", { method: "POST" });
          if (!res.ok) throw new Error("start failed");
          st.textContent = "Núcleo arrancado.";
          setTimeout(refreshState, 800);
        } catch (_) {
          st.textContent = "No se pudo arrancar el núcleo. Revisa los logs.";
        }
      });

      $("enroll-form").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const code = $("enroll-code").value.trim();
        const st = $("enroll-status");
        if (!code) { st.textContent = "Introduce el activation code."; return; }
        $("enroll-submit").disabled = true;
        st.textContent = "Enrolando…";
        try {
          const res = await fetch("/v1/enroll", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ activation_code: code }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            st.textContent = (body.error && body.error.message) || "No se pudo enrolar. Revisa el código.";
            $("enroll-submit").disabled = false;
            return;
          }
          st.textContent = "✅ Equipo enrolado. Ahora inicia sesión.";
          setTimeout(refreshState, 700);
        } catch (_) {
          st.textContent = "Error de red al enrolar.";
          $("enroll-submit").disabled = false;
        }
      });

      $("login-form").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const email = $("login-email").value.trim();
        const password = $("login-password").value;
        const errEl = $("login-error");
        show(errEl, false);
        $("login-submit").disabled = true;
        try {
          const res = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          if (res.ok) {
            window.location = "/";
            return;
          }
          const body = await res.json().catch(() => ({}));
          errEl.textContent = (body.error && body.error.message) || "No se pudo iniciar sesión.";
          show(errEl, true);
        } catch (_) {
          errEl.textContent = "Error de red al iniciar sesión.";
          show(errEl, true);
        } finally {
          $("login-submit").disabled = false;
        }
      });

      const alphaSel = $("alpha-user-select");
      if (alphaSel) {
        alphaSel.addEventListener("change", (e) => {
          const opt = e.target.options[e.target.selectedIndex];
          const em = opt.getAttribute("data-email");
          const pw = opt.getAttribute("data-password");
          if (em && pw) {
            const emailInp = $("login-email");
            const passInp = $("login-password");
            if (emailInp) emailInp.value = em;
            if (passInp) passInp.value = pw;
          }
        });
      }

      refreshState();
    </script>
  </body>
</html>
